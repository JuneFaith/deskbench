[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "deskbench"
version = "0.1.0"
description = "Evaluation and reliability benchmark for enterprise service-desk agents"
readme = "README.md"
authors = [{ name = "deskbench contributors" }]
requires-python = ">=3.10"
license = { text = "MIT License" }
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "anyio>=4",
  "httpx>=0.27",
  "pydantic>=2",
  "pyyaml>=6",
]

[project.optional-dependencies]
remote = ["fsspec>=2024.6", "s3fs>=2024.6"]
dev = [
  "mypy>=1.10",
  "pytest>=8",
  "pytest-cov",
  "ruff==0.9.6",
  "types-PyYAML",
]

[project.scripts]
deskbench = "deskbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["deskbench*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra"
pythonpath = [".", "src"]
markers = [
  "integration: requires a running tix deployment",
]

[tool.ruff]
src = ["src", "tests"]
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "D"]
ignore = ["D10", "D203", "D213", "E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
