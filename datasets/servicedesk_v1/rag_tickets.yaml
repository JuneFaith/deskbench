  # ============ 第三批补充（2026-08-10）：account_permission 补充 ============
  - id: rag-tkt-ac-007
    title: "第三方应用 OAuth scope 请求过大"
    description: "接入的第三方应用申请全部资源权限的 scope，授权页展示范围过大，存在超范围访问风险"
    category: account_permission
    tags: [权限, oauth, scope, 最小权限]
    priority: P2
    resolution: "按 OAuth 2.0 规范（RFC 6749 §3.3）：scope 为空格分隔的权限字符串，每个 scope 增加一段访问范围；授权服务器可基于策略或资源所有者指示完全/部分忽略客户端请求的 scope，签发范围不同时须用 scope 响应参数告知客户端；客户端省略 scope 时服务器须用预定义默认值处理或拒绝。实践：scope 最小化授予，服务器侧按策略裁剪并回告实际授予范围"
    source_ref: "https://datatracker.ietf.org/doc/html/rfc6749#section-3.3"

