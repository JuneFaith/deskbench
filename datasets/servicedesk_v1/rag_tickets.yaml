# RAG 评测工单语料（第一批：database/network/security）
# 故障模式与解法要素来自真实公开来源（source_ref 标注出处），按本项目 schema 规范化。
# 状态统一 resolved（评测检索对象）。

tickets:
  # ============ database ============
  - id: rag-tkt-db-001
    title: "应用连库报 FATAL: password authentication failed"
    description: "业务应用夜间批量任务开始后频繁报 password authentication failed，密码未变更过，客户端与服务端均无法确认失败细节"
    category: database
    tags: [postgres, 认证, 密码]
    priority: P1
    resolution: "按官方排查路径核对：确认 pg_hba.conf 的认证方法（scram-sha-256）与客户端协商一致，核对密码是否正确；服务端日志可能比客户端报错包含更多失败细节（如账户锁定、Kerberos/ident 组件状态），先查服务器日志定位"
    source_ref: "https://www.postgresql.org/docs/17/client-authentication-problems.html"
  - id: rag-tkt-db-002
    title: "PostgreSQL 启动报 Address already in use"
    description: "数据库服务器重启时启动失败，日志显示 could not bind IPv4 address \"127.0.0.1\": Address already in use，端口 5432 疑似被占用"
    category: database
    tags: [postgres, 启动, 端口]
    priority: P2
    resolution: "官方文档：该错误通常表示同端口已有 postmaster 在运行；若无实例运行则等待几秒重试。检查 postmaster.pid（数据目录内）确认是否多实例冲突；排查占用 5432 的其他进程"
    source_ref: "https://www.postgresql.org/docs/17/server-start.html"
  - id: rag-tkt-db-003
    title: "云上 RDS PostgreSQL 连接超时 Connection timed out"
    description: "从应用服务器连接 RDS 实例报 could not connect to server: Connection timed out，内网地址 ping 不通"
    category: database
    tags: [postgres, rds, 网络, 白名单]
    priority: P1
    resolution: "按云厂商排查路径：确认连接地址类型（内网/外网）与网络类型一致（同地域、同 VPC）；检查客户端 IP 是否加入白名单或白名单分组是否正确；确认实例未因过期/磁盘满被锁定"
    source_ref: "https://help.aliyun.com/zh/rds/apsaradb-rds-for-postgresql/what-do-i-do-if-i-fail-to-connect-to-an-apsaradb-rds-instance"
  - id: rag-tkt-db-004
    title: "连接报 remaining connection slots are reserved"
    description: "生产库连接数打满，新连接报 FATAL: remaining connection slots are reserved for non-replication superuser connections，大量业务报错"
    category: database
    tags: [postgres, 连接数, 连接池]
    priority: P0
    resolution: "连接数满：关闭占用连接数的进程，排查应用连接池泄漏与慢查询长时间占用连接；确认 max_connections 与实际连接水位"
    source_ref: "https://help.aliyun.com/zh/rds/apsaradb-rds-for-postgresql/what-do-i-do-if-i-fail-to-connect-to-an-apsaradb-rds-instance"
  - id: rag-tkt-db-005
    title: "数据库启动失败 could not create any TCP/IP sockets"
    description: "实例重启后 FATAL: could not create any TCP/IP sockets，疑似监听端口被保留或冲突"
    category: database
    tags: [postgres, 启动, socket]
    priority: P2
    resolution: "官方文档：could not create any TCP/IP sockets 通常与端口占用相关（Address already in use 变体）；检查是否试图在保留端口上启动，确认监听配置与端口占用，查看服务器日志或前台启动观察报错"
    source_ref: "https://www.postgresql.org/docs/17/server-start.html"

  # ============ network ============
  - id: rag-tkt-net-001
    title: "OpenVPN 客户端报 TLS key negotiation failed"
    description: "远程办公用户连接公司 VPN 失败，客户端报 TLS Error: TLS key negotiation failed to occur within 60 seconds"
    category: network
    tags: [vpn, openvpn, tls, 连接]
    priority: P1
    resolution: "官方排查：该错误表示客户端无法连通服务器。确认客户端使用正确的 hostname/IP 与端口；确认服务器防火墙放行 UDP 1194（或配置的端口）；确认网关端口转发规则正确指向 VPN 服务器"
    source_ref: "https://openvpn.net/community-docs/starting-up-the-vpn-and-testing-for-initial-connectivity.html"
  - id: rag-tkt-net-002
    title: "VPN 连接成功但 ping 不通内网"
    description: "客户端显示 Initialization Sequence Completed，但 ping 内网服务器失败"
    category: network
    tags: [vpn, openvpn, ping, 路由]
    priority: P2
    resolution: "官方排查：ping 失败通常表示服务器或客户端防火墙在过滤 TUN/TAP 接口上的 VPN 流量；检查 TUN/TAP 接口是否被防火墙过滤，客户端使用路由模式时先 ping 网关 10.8.0.1 验证隧道连通"
    source_ref: "https://openvpn.net/community-docs/starting-up-the-vpn-and-testing-for-initial-connectivity.html"
  - id: rag-tkt-net-003
    title: "VPN 服务器日志显示单向连接 TLS initial packet"
    description: "连接在 startup 时卡住，服务器日志显示 TLS: Initial packet from ... 但客户端日志无对应行"
    category: network
    tags: [vpn, openvpn, 单向连接]
    priority: P2
    resolution: "官方文档：该现象表示只有客户端到服务器方向的连接，服务器到客户端方向被阻断——检查服务器侧防火墙与网关是否放行回程流量（UDP 1194 双向）"
    source_ref: "https://openvpn.net/community-docs/starting-up-the-vpn-and-testing-for-initial-connectivity.html"
  - id: rag-tkt-net-004
    title: "DNS 解析超时导致业务域名不可访问"
    description: "多个内部系统域名解析超时，nslookup 无响应，浏览器访问报 DNS_PROBE_FINISHED_NXDOMAIN"
    category: network
    tags: [dns, 解析, 超时]
    priority: P1
    resolution: "DNS 是几乎所有网络连接的前置依赖（ISC BIND 官方概述）。排查：确认 DNS 服务（BIND 等）运行状态与配置（转发/缓存/监听），检查解析链路各环节可达性，查看解析日志定位超时环节"
    source_ref: "https://www.isc.org/bind/"
  - id: rag-tkt-net-005
    title: "防火墙放行后端口仍不可达"
    description: "新服务上线需开放 TCP 端口，防火墙规则已添加但外部仍无法访问"
    category: network
    tags: [防火墙, 端口, 连通性]
    priority: P2
    resolution: "分层排查：服务监听地址（0.0.0.0 vs 127.0.0.1）、主机防火墙规则、网关端口转发；若规则正确仍丢包，检查连接跟踪（conntrack）表——nf_conntrack_max 上限、INVALID 状态包（校验和不符）、已建立连接未被跟踪（tcp_loose）等"
    source_ref: "https://docs.kernel.org/networking/nf_conntrack-sysctl.html"

  # ============ security ============
  - id: rag-tkt-sec-001
    title: "MOVEit Transfer SQL 注入漏洞排查"
    description: "公网文件传输系统版本在受影响范围内，安全团队要求确认是否存在 CVE-2023-34362 利用痕迹并完成修复"
    category: security
    tags: [安全, sql注入, cve, moveit]
    priority: P0
    resolution: "该 CVE 为 MOVEit Transfer 未认证 SQL 注入，2023 年 5-6 月在野外被利用：升级到修复版本（2021.0.6 等对应版本线），排查数据库异常访问痕迹，检查 HTTP/HTTPS 入口的异常请求"
    source_ref: "https://nvd.nist.gov/vuln/detail/CVE-2023-34362"
  - id: rag-tkt-sec-002
    title: "公网服务器暴力破解登录尝试"
    description: "服务器日志出现大量 SSH 登录失败尝试，来源 IP 分散，疑似撞库或暴力破解"
    category: security
    tags: [安全, 暴力破解, ssh]
    priority: P2
    resolution: "加固措施：禁用密码登录改用密钥认证、限制来源 IP、配置失败次数锁定，检查是否存在弱口令账户并重置"
    source_ref: "https://cheatsheetseries.owasp.org/cheatsheets/Authentication_Cheat_Sheet.html"
  - id: rag-tkt-sec-003
    title: "SSL 证书过期导致 HTTPS 服务不可用"
    description: "站点 HTTPS 访问报证书过期错误，浏览器提示 NET::ERR_CERT_DATE_INVALID"
    category: security
    tags: [安全, ssl, 证书]
    priority: P1
    resolution: "重新申请/续期证书（Let's Encrypt 等 CA，certbot 官方指引：变更证书域/续期流程）并部署到服务端；验证证书链完整性与到期时间；配置自动化续期（certbot renew）避免再次过期"
    source_ref: "https://certbot.eff.org/change-cert-domain"
  - id: rag-tkt-sec-004
    title: "越权访问排查：普通账户访问管理接口"
    description: "安全扫描发现普通用户可访问部分管理接口，返回数据疑似越权"
    category: security
    tags: [安全, 越权, 鉴权]
    priority: P1
    resolution: "检查接口鉴权链路：确认服务端对每个请求执行授权校验而非仅前端隐藏入口，检查角色/权限映射配置与默认拒绝策略"
    source_ref: "https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Cheat_Sheet.html"

  # ============ frontend ============
  - id: rag-tkt-fe-001
    title: "页面加载缓慢，DNS 解析耗时明显"
    description: "首屏加载慢，性能分析显示 DNS lookup 阶段耗时高，页面引用多个不同域名的资源（字体/图片/脚本/统计）"
    category: frontend
    tags: [性能, dns, 加载]
    priority: P2
    resolution: "DNS 查询每个唯一 hostname 发生一次（首次访问后缓存）。优化：减少跨域资源域名数量、利用 DNS 缓存与预解析（preconnect/dns-prefetch）、移动网络场景降低 DNS 依赖"
    source_ref: "https://developer.mozilla.org/en-US/docs/Web/Performance/How_browsers_work"
  - id: rag-tkt-fe-002
    title: "首屏交互卡顿，主线程繁忙"
    description: "页面滚动和点击响应慢，渲染卡顿，开发工具显示主线程长时间被任务占用"
    category: frontend
    tags: [性能, 主线程, 渲染]
    priority: P2
    resolution: "浏览器主要单线程执行任务：最小化主线程职责（长任务拆分、避免阻塞渲染的同步操作），确保渲染流畅且交互响应及时；用性能面板定位长任务"
    source_ref: "https://developer.mozilla.org/en-US/docs/Web/Performance/How_browsers_work"
  - id: rag-tkt-fe-003
    title: "HTTPS 站点 TLS 握手慢"
    description: "站点访问延迟高，连接建立阶段耗时明显，用户反馈首次访问特别慢"
    category: frontend
    tags: [性能, tls, https]
    priority: P2
    resolution: "HTTPS 需额外 TLS 协商握手（协商加密套件与验证服务器）。优化：TLS 会话复用、HTTP/2/3、会话缓存，减少握手开销"
    source_ref: "https://developer.mozilla.org/en-US/docs/Web/Performance/How_browsers_work"
  - id: rag-tkt-fe-004
    title: "前端构建失败，生产发布阻塞"
    description: "CI 构建报错无法产出产物，发布流程阻塞，本地构建可复现"
    category: frontend
    tags: [前端, 构建, ci]
    priority: P1
    resolution: "按构建报错类型定位（vite 官方 troubleshooting）：模块解析失败——ESM only 包被 require 加载报 ERR_REQUIRE_ESM，需改用 import 或配置 type:module；文件监视器超限——ENOSPC: System limit for number of file watchers reached，提高 sysctl fs.inotify 与 ulimit 限制；CLI 模块路径异常——项目路径含特殊字符（如 &）导致 npm 无法解析"
    source_ref: "https://vitejs.dev/guide/troubleshooting"
  - id: rag-tkt-fe-005
    title: "接口 500 频发导致前端报错"
    description: "前端页面频繁报接口错误，后端网关返回 5xx，业务可用性下降"
    category: frontend
    tags: [前端, api, 5xx]
    priority: P1
    resolution: "区分前端展示问题与后端故障：抓取错误响应与网关日志定位上游；5xx 排查参考网关层调试手段（error_page 捕获、日志采样）"
    source_ref: "https://blog.nginx.org/blog/capturing-5xx-errors-debug-server"

  # ============ account_permission ============
  - id: rag-tkt-ac-001
    title: "普通用户可访问管理接口（越权）"
    description: "安全测试发现普通用户调用管理接口可返回敏感数据，疑似 Broken Access Control"
    category: account_permission
    tags: [权限, 越权, 鉴权]
    priority: P1
    resolution: "服务端每个请求强制授权校验（不依赖前端隐藏）；最小权限原则水平+垂直应用；参考 OWASP 授权备忘单的默认拒绝与角色映射实践"
    source_ref: "https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Cheat_Sheet.html"
  - id: rag-tkt-ac-002
    title: "用户 A 能查看用户 B 的数据（水平提权）"
    description: "用户反馈可访问他人订单数据，修改 URL 中 ID 后返回他人信息"
    category: account_permission
    tags: [权限, 水平提权, 数据隔离]
    priority: P0
    resolution: "对象级授权缺失：确认资源访问时校验当前用户对目标对象的授权（属主/共享关系），而非仅校验登录态；补充对象级权限测试"
    source_ref: "https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Cheat_Sheet.html"
  - id: rag-tkt-ac-003
    title: "员工权限申请流程阻塞"
    description: "新员工入职需要开通系统权限，申请流程审批停滞，业务无法开展"
    category: account_permission
    tags: [权限, 流程]
    priority: P2
    resolution: "权限申请按最小权限分配，审批链路逐级确认；使用可追踪的申请工单记录权限变更，定期复核存量权限"
    source_ref: "https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Cheat_Sheet.html"
  - id: rag-tkt-ac-004
    title: "SSO 登录失败，无法访问内部系统"
    description: "员工通过 SSO 单点登录报错无法进入系统，其他系统可正常登录"
    category: account_permission
    tags: [权限, sso, 登录]
    priority: P1
    resolution: "Keycloak 官方概述：作为 OAuth2/OIDC/SAML 兼容服务器可保护任意应用；优先利用应用生态（框架/反向代理）已有的协议支持，客户端适配器仅作最后手段。排查 SSO 链路：确认认证协议配置（OIDC/SAML）与回调、角色映射与授权策略——区分认证失败与授权失败"
    source_ref: "https://www.keycloak.org/securing-apps/overview"

  # ============ os ============
  - id: rag-tkt-os-001
    title: "磁盘空间满导致服务写入失败"
    description: "服务日志报磁盘空间不足，写入失败，df 显示根分区使用率 100%"
    category: os
    tags: [磁盘, 空间]
    priority: P1
    resolution: "定位大文件与日志增长源（du 逐层排查），清理归档并配置日志轮转；确认分区挂载与 inode 使用情况"
    source_ref: "https://man7.org/linux/man-pages/man1/du.1.html"
  - id: rag-tkt-os-002
    title: "内存不足触发 OOM，服务被 kill"
    description: "应用进程被 OOM killer 终止，系统日志显示 out of memory，业务中断"
    category: os
    tags: [内存, oom]
    priority: P0
    resolution: "排查内存压力来源：进程占用与泄漏（内存持续增长）、页缓存与匿名内存分布；内核在内存耗尽时经回收与 OOM killer 终止进程——定位高占用进程并治理"
    source_ref: "https://docs.kernel.org/admin-guide/mm/concepts.html"
  - id: rag-tkt-os-003
    title: "CPU 使用率持续高位"
    description: "服务器 CPU 长时间 100%，服务响应变慢，未发现明显业务增长"
    category: os
    tags: [cpu, 性能]
    priority: P2
    resolution: "用 top 动态查看系统摘要（负载、CPU 状态）与进程/线程列表，定位高 CPU 消耗进程并按 CPU 排序；top 的字段/排序可交互配置（h 帮助、q 退出）；区分用户态与内核态 CPU 开销，排查循环/空转任务"
    source_ref: "https://man7.org/linux/man-pages/man1/top.1.html"
  - id: rag-tkt-os-004
    title: "free 显示内存占用高，业务无明显增长"
    description: "运维看到内存使用率 90%+ 报警，但业务进程实际占用不高，怀疑内存泄漏"
    category: os
    tags: [内存, 页缓存]
    priority: P2
    resolution: "区分页缓存与匿名内存：页缓存（cache）可在内存压力下被回收，不直接代表业务占用；用 free/内存统计确认构成，评估是否需调整内核回收策略"
    source_ref: "https://docs.kernel.org/admin-guide/mm/concepts.html"

  # ============ middleware ============
  - id: rag-tkt-mw-001
    title: "网关 5xx 频发，上游间歇性失败"
    description: "Nginx 反向代理频繁返回 502/504，上游应用间歇性不可用，用户投诉增多"
    category: middleware
    tags: [nginx, 5xx, 网关]
    priority: P1
    resolution: "生产 5xx 调试困难：可用官方推荐的 Debug Server 方案——error_page 将失败请求重试到专用调试上游（只接收错误请求），其日志聚焦错误事件，缩小定位范围；启用调试日志/性能剖析定位上游故障"
    source_ref: "https://blog.nginx.org/blog/capturing-5xx-errors-debug-server"
  - id: rag-tkt-mw-002
    title: "error_page 配置未生效"
    description: "配置了 error_page 自定义错误页但访问仍显示默认 5xx 页面"
    category: middleware
    tags: [nginx, error_page]
    priority: P2
    resolution: "检查 error_page 指令作用域（http/server/location）与页面文件路径、权限；确认是代理产生的 5xx（proxy_intercept_errors 需开启才能拦截上游错误）"
    source_ref: "https://nginx.org/en/docs/http/ngx_http_core_module.html"
  - id: rag-tkt-mw-003
    title: "上游并发高峰 5xx 雪崩"
    description: "大促流量高峰网关 5xx 增多，上游被打满，需要保护"
    category: middleware
    tags: [nginx, 限流, 上游]
    priority: P1
    resolution: "对上游做连接/并发限制（如 server 指令 max_conns 限制转发到调试或受限上游的并发连接），避免雪崩；配置合理的超时与重试策略"
    source_ref: "https://blog.nginx.org/blog/capturing-5xx-errors-debug-server"

  # ============ backup ============
  - id: rag-tkt-bk-001
    title: "数据库备份失败：权限不足"
    description: "定时备份任务报权限错误，pg_dump 无法读取部分表，备份不完整"
    category: backup
    tags: [备份, postgres, 权限]
    priority: P1
