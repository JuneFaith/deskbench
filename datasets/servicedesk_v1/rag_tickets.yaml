  - id: rag-tkt-mw-007
    title: "WebSocket 反向代理连接失败"
    description: "前端 WebSocket 经 Nginx 反代后连接失败或频繁断开，直连后端正常"
    category: middleware
    tags: [nginx, websocket, upgrade, 代理]
    priority: P1
    resolution: "按 nginx 官方文档（WebSocket proxying）：Upgrade/Connection 是逐跳（hop-by-hop）头，反向代理默认不转发，需显式传递 proxy_set_header Upgrade $http_upgrade 与 proxy_set_header Connection \"upgrade\"（或用 map 依据 $http_upgrade 动态设置 Connection）；默认 60 秒无数据即关闭连接，可调大 proxy_read_timeout 或让后端周期性发送 WebSocket ping 帧保活"
    source_ref: "https://nginx.org/en/docs/http/websocket.html"

  # ============ 第四批补充（2026-08-10）：补齐孤儿 KB 对应工单 ============
  - id: rag-tkt-mw-008
    title: "站点遭 HTTP/2 Rapid Reset 攻击，连接被快速重置"
    description: "大流量请求以极高频率建立 HTTP/2 连接并立即重置（RST_STREAM），服务器资源被持续消耗，业务响应变慢，疑似 DDoS 攻击"
    category: middleware
    tags: [http2, ddos, nginx, 安全]
    priority: P1
    resolution: "按 NVD CVE-2023-44487 记录处置：该漏洞为 HTTP/2 协议层拒绝服务——攻击者通过快速取消（RST_STREAM）大量并发流，使服务器持续处理重置请求而消耗资源，可发起规模空前的 DDoS 攻击；2023 年 8-10 月在野外被利用。处置：升级到修复版本；按厂商公告施加缓解措施（限制单连接并发流数、收紧 RST_STREAM 处理速率）；监控异常流量与资源水位"
    source_ref: "https://nvd.nist.gov/vuln/detail/CVE-2023-44487"
  - id: rag-tkt-bk-008
    title: "批量删除事故：误删大量站点数据"
    description: "清理遗留应用的任务脚本误将整个站点 ID 传入删除 API，短时间内删除大量客户站点数据，业务中断，需要止损与恢复"
    category: backup
    tags: [删除, 数据安全, 事故, 恢复]
    priority: P0
    resolution: "参照 Atlassian 2022 PIR 复盘要点：高危操作前置防护——删除类任务对输入做类型/范围校验（软删除、二次确认、类型不匹配告警）；恢复准备——多站点多产品自动化恢复能力与 DR 演练常态化直接决定 RTO，客户联系信息等关键元数据需独立备份；复盘产出——删除流程分级审批、大规模事故演练与公开沟通预案"
    source_ref: "https://www.atlassian.com/engineering/post-incident-review-april-2022-outage"

  # ============ 第五批补充（2026-08-10）：弱主题 account_permission/os/frontend ============
  - id: rag-tkt-ac-008
    title: "员工账号遭撞库，需强制全员启用 MFA"
    description: "安全团队发现多个员工账号被撞库登录，密码为弱口令且多系统复用，要求所有账号强制启用多因素认证"
    category: account_permission
    tags: [权限, mfa, 2fa, 认证, 撞库]
    priority: P1
    resolution: "按 OWASP 多因素认证备忘单：MFA 是抵御口令类攻击（暴力破解/撞库/口令喷洒）的最佳防线（微软分析称可阻止 99.9% 账号入侵），且应以密码终将泄露为前提设计系统。实施：要求所有用户启用某种 MFA（首选 TOTP）；管理员等高权限账号强制 MFA；提供安全的 MFA 重置流程；改密/改邮箱/关闭 MFA/会话提权等敏感操作也要求 MFA；多认证入口（独立 API/移动端）同样要求 MFA；注意要求多个同类因子（如密码+PIN）不构成 MFA"
    source_ref: "https://cheatsheetseries.owasp.org/cheatsheets/Multifactor_Authentication_Cheat_Sheet.html"
  - id: rag-tkt-ac-009
    title: "API 接口可枚举对象 ID 访问他人数据（BOLA）"
    description: "安全测试发现订单查询 API 接受任意订单 ID 且不校验属主，遍历 ID 可拉取其他用户订单数据"
    category: account_permission
    tags: [权限, bola, idor, api, 越权]
    priority: P0
    resolution: "按 OWASP API Security Top 10（API1:2023 Broken Object Level Authorization）：对象级授权应在代码层实现——每个接收对象 ID 并执行操作的 API 端点都应校验当前用户对该对象的操作权限；仅比对会话用户 ID（如 JWT 中）与参数 ID 不足以解决 BOLA；对象 ID 优先用随机不可预测的 GUID；为授权机制编写测试并禁止部署使测试失败的改动；注意区分 BOLA（对象级越权，用户本就有端点访问权）与 BFLA（功能级越权）"
    source_ref: "https://owasp.org/API-Security/editions/2023/en/0xa1-broken-object-level-authorization/"
  - id: rag-tkt-os-008
    title: "应用报 too many open files，文件描述符耗尽"
    description: "线上服务运行一段时间后开始报 too many open files，重启后恢复，连接数增长后必现"
    category: os
    tags: [os, 文件描述符, ulimit, nofile]
    priority: P1
    resolution: "按 limits.conf(5) 手册：/etc/security/limits.conf（与 limits.d 下 *.conf）经 pam_limits.so 对登录会话施加 ulimit，语法 <domain> <type> <item> <value>，nofile 限制最大打开文件描述符数（hard 由 root 设定、用户不可超过，soft 可在 hard 范围内上调）；排查：确认运行用户/组的 nofile 软硬限制（ulimit -n）、用 lsof/ss 检查进程打开的文件与连接，定位句柄泄漏（连接未关闭/文件未释放）；按业务需要调整 limits.conf，必要时同步核对系统级上限 /proc/sys/fs/file-max"
    source_ref: "https://man7.org/linux/man-pages/man5/limits.conf.5.html"
  - id: rag-tkt-fe-009
    title: "发布新版本后用户仍看到旧页面（缓存未更新）"
    description: "前端发布新版本后部分用户仍加载旧资源、功能异常，多次刷新才更新，疑似浏览器或 CDN 缓存"
    category: frontend
    tags: [前端, 缓存, http, cache-control]
    priority: P2
    resolution: "按 MDN HTTP Caching：响应分 fresh（可重用）与 stale（过期需重新验证）两态，判定标准通常由 Cache-Control 决定；无 Cache-Control 时响应可能被启发式缓存重用（规范建议约按存储时间的 10%）。处置：静态资源用内容指纹文件名（hash 命名）+ 长 max-age，HTML 用 no-cache 每次重新验证，发布时确保 HTML 引用新指纹资源；CDN 侧按 Cache-Control 管理缓存并提供主动清除手段"
    source_ref: "https://developer.mozilla.org/en-US/docs/Web/HTTP/Caching"

  # ============ 第六批补充（2026-08-11）：弱主题 frontend/account_permission/os 补强 ============
  - id: rag-tkt-fe-010
    title: "前端跨域请求被浏览器拦截（CORS 报错）"
    description: "页面调用另一域名下的 API 报 CORS 错误，浏览器控制台提示 Cross-Origin Request Blocked，直连后端正常"
    category: frontend
    tags: [前端, cors, 跨域, 浏览器]
    priority: P2
    resolution: "按 MDN CORS errors 文档：CORS 违规的具体原因只对浏览器可见（JavaScript 只能感知失败），先用开发者工具复现并读取控制台错误文本（含 Reason 字段）定位；多数 CORS 错误只能在服务端解决——服务端控制是否允许跨域访问：核对 Access-Control-Allow-Origin 是否与请求 Origin 匹配（通配 * 不能与 credentials 搭配）、Access-Control-Allow-Methods/Headers 是否覆盖预检请求；客户端可做的有限：将请求改写为简单请求（仅 GET/HEAD/POST + safelisted 头）避免预检、不读响应时用 no-cors 模式、或经自控代理转发并附加 CORS 头"
    source_ref: "https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/CORS/Errors"
  - id: rag-tkt-ac-010
    title: "忘记密码接口可枚举用户（响应差异）"
    description: "安全测试发现忘记密码接口对存在与不存在的账号返回不同提示，攻击者可据此枚举有效用户名"
    category: account_permission
    tags: [权限, 认证, 密码重置, 枚举]
    priority: P1
    resolution: "按 OWASP Forgot Password Cheat Sheet：忘记密码是用户枚举攻击的常见来源。修复：对存在与不存在账号返回一致消息且响应耗时一致（异步调用或统一逻辑，不用快速退出分支）；防自动化刷请求——按账号限流、CAPTCHA 等；重置令牌用密码学安全随机数生成、足够长防暴力破解、安全存储、一次性且适当过期；未验证有效令牌前不改变账号状态（如不锁定账号，否则会被利用做拒绝服务）；用户重置后通过常规机制重新登录（不自动登录），并作废既有会话"
    source_ref: "https://cheatsheetseries.owasp.org/cheatsheets/Forgot_Password_Cheat_Sheet.html"
  - id: rag-tkt-os-009
    title: "应用日志不轮转，磁盘空间持续增长"
    description: "服务日志文件不断增大不做轮转，磁盘使用率持续上升，运维需要配置日志轮转策略"
    category: os
    tags: [日志, 轮转, logrotate, 磁盘]
    priority: P2
    resolution: "按 logrotate(8) 手册配置：logrotate 用于轮转/压缩/删除/邮件发送日志，通常作为每日 cron（或 systemd logrotate.timer）运行；同一日志一天最多轮转一次（除非按 size 触发且每日多次运行）。配置示例：/var/log/messages { rotate 5; weekly; compress; missingok; postrotate killall -HUP <daemon>; endscript }——rotate count 控制保留份数（0 即轮转后删除），size 100k/100M/100G 按大小触发（与时间间隔互斥）；程序无法被告知关闭日志文件时用 copytruncate；大日志建议压缩旧版（compress）并用 dateext 日期后缀。排查：确认 cron/timer 在运行、用 -d 调试模式验证配置（不实际修改）、-f 强制轮转"
    source_ref: "https://man7.org/linux/man-pages/man8/logrotate.8.html"
