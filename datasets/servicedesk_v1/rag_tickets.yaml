    tags: [postgres, 连接, refused]
    priority: P1
    resolution: "官方文档（18.3.2 Client Connection Problems）：Connection refused 是\"找不到服务器对话\"的通用失败——通常表示该地址/端口上没有服务器在监听，常见原因是服务器未配置允许 TCP/IP 连接（listen_addresses）；注意该错误不表示服务器拒绝连接请求（被拒绝会返回另一类消息，见认证章节）；Unix socket 场景对应 No such file or directory，核对客户端 socket 路径与服务器 unix_socket_directories 是否一致；Connection timed out 通常指向网络连通性缺失或防火墙阻断"
    source_ref: "https://www.postgresql.org/docs/17/server-start.html"

