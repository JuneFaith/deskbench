  # ============ database ============
  - id: rag-kb-db-001
    title: "PostgreSQL 认证失败：FATAL 错误定位路径"
    summary: "三类典型 FATAL 认证错误含义 + 服务器日志判读"
    body: |
      依据官方文档（20.15 Authentication Problems）：
      1) FATAL: no pg_hba.conf entry for host "…", user "…", database "…"
         → 已连通服务器但 pg_hba.conf 无匹配条目，拒绝连接。检查 pg_hba.conf
         中 host 记录的顺序（首条匹配生效）与 address/method 列；修改后执行
         pg_ctl reload（无需重启）。
      2) FATAL: password authentication failed for user "…"
         → 已通过服务器认证方法检查，但密码/Kerberos/ident 凭据不正确。
         核对密码与认证方法（scram-sha-256）一致性。
      3) FATAL: user "…" does not exist / database "…" does not exist
         → 角色或库不存在；未指定库名时默认等于用户名。
      判读提示：服务端日志可能比客户端报错包含更多失败细节，困惑时先查服务器日志。
    source_type: official_doc
    source_ref: "https://www.postgresql.org/docs/17/client-authentication-problems.html"
    category: database
    tags: [postgres, 认证, pg_hba, FATAL]
    confidence: 1.0
  - id: rag-kb-db-002
    title: "PostgreSQL 服务器启动失败排查"
    summary: "启动失败常见错误含义与诊断入口"
    body: |
      依据官方文档（18.3 Starting the Database Server）：
      - LOG: could not bind IPv4 address "127.0.0.1": Address already in use
        HINT: Is another postmaster already running on port 5432?
        → 同端口已有实例在运行；若无实例则等待几秒重试。
      - FATAL: could not create any TCP/IP sockets
        → 与端口占用相关；若内核错误非 Address already in use，可能是试图在
        保留端口上启动。
      - postmaster.pid（数据目录内）用于防止同一数据目录多实例运行。
      诊断入口：查看服务器日志；或前台启动（不重定向 stdout/stderr）直接观察报错。
      生产建议：将服务器 stdout/stderr 重定向到日志文件（postgres -D … >logfile 2>&1 &
      或 pg_ctl start -l logfile），便于审计与诊断。
    source_type: official_doc
    source_ref: "https://www.postgresql.org/docs/17/server-start.html"
    category: database
    tags: [postgres, 启动, 端口, pg_ctl]
    confidence: 1.0
  - id: rag-kb-db-003
    title: "云上 RDS PostgreSQL 无法连接：报错-原因-解法对照"
    summary: "云厂商官方文档的常见连接失败错误对照表"
    body: |
      依据阿里云官方文档（解决无法连接实例问题）：
      - Connection timed out → 网络互通/白名单问题：确认连接地址类型（内网/外网），
        ECS 与 RDS 需同地域且网络类型一致（VPC 则需同一专有网络）；客户端 IP 加入白名单，
        高安全白名单模式需确认分组正确。
      - FATAL: no pg_hba.conf entry → 白名单设置问题，检查白名单与分组。
      - FATAL: remaining connection slots are reserved → 连接数满，关闭占用连接的进程。
      - FATAL: password authentication failed → 密码错误，重置后重试。
      - Destination Host Unreachable → ECS 内网网段与 RDS 网段冲突。
      - 实例锁定：RDS 实例过期或磁盘满会被锁定（报错提示 rds-deny-access），
        续费或扩容磁盘后自动解锁。
    source_type: vendor_kb
    source_ref: "https://help.aliyun.com/zh/rds/apsaradb-rds-for-postgresql/what-do-i-do-if-i-fail-to-connect-to-an-apsaradb-rds-instance"
    category: database
    tags: [postgres, rds, 连接, 白名单, 错误码]
    confidence: 0.95

  # ============ network ============
  - id: rag-kb-net-001
    title: "OpenVPN 连接失败：常见症状与解决清单"
    summary: "官方文档连接排查 checklist（连通性/端口/防火墙）"
    body: |
      依据 OpenVPN 官方文档（Starting Up the VPN and Testing for Initial Connectivity）：
      前置要求：防火墙放行 UDP 1194（或配置的端口）；网关配置端口转发到 VPN 服务器；
      确保 TUN/TAP 接口不被防火墙过滤。
      验证：命令行启动 openvpn [config]，正常结束于 Initialization Sequence Completed；
      路由模式 ping 10.8.0.1，桥接模式 ping 服务器网段主机。
      常见症状：
      - TLS Error: TLS key negotiation failed to occur within 60 seconds
        → 客户端无法连通服务器：核对 hostname/IP/端口；检查 NAT 端口转发规则；
        放行服务器防火墙入站 UDP 1194。
      - Initialization Sequence Completed with errors（Windows）
        → DHCP client 服务未运行或第三方防火墙不兼容。
      - 连接成功但 ping 失败 → 服务器或客户端防火墙过滤 TUN/TAP 接口流量。
      - 服务器日志出现 TLS: Initial packet from … 但客户端无对应行
        → 单向连接：服务器到客户端方向被阻断，检查回程流量放行。
    source_type: official_doc
    source_ref: "https://openvpn.net/community-docs/starting-up-the-vpn-and-testing-for-initial-connectivity.html"
    category: network
    tags: [vpn, openvpn, 连接, 防火墙, "1194"]
    confidence: 1.0
  - id: rag-kb-net-002
    title: "VPN 隧道连通性验证步骤（初始部署）"
    summary: "从官方验证流程提炼的可执行检查步骤"
    body: |
      依据 OpenVPN 官方文档提炼的部署验证步骤：
      1) 服务器命令行前台启动 openvpn [server.ovpn]，确认输出以
         Initialization Sequence Completed 结束。
      2) 客户端命令行启动 openvpn [client.ovpn]，同样确认初始化完成。
      3) 路由模式（dev tun）：客户端 ping 10.8.0.1 验证隧道；
         桥接模式（dev tap）：ping 服务器以太网子网内主机。
      4) ping 成功即隧道可用；失败按日志定位：初始化未完成→连通性/端口/转发；
         初始化完成但 ping 失败→TUN/TAP 接口被防火墙过滤。
    source_type: best_practice
    source_ref: "https://openvpn.net/community-docs/starting-up-the-vpn-and-testing-for-initial-connectivity.html"
    category: network
    tags: [vpn, openvpn, 验证, ping]
    confidence: 1.0
  - id: rag-kb-net-003
    title: "连接跟踪（conntrack）与连接失败排查"
    summary: "内核官方文档：conntrack 表上限/INVALID 状态/已建立连接跟踪"
    body: |
      依据 Linux Kernel 官方文档（Netfilter Conntrack Sysfs Variables）：
      当防火墙规则正确但连接仍失败/丢包时，检查连接跟踪（conntrack）：
      - nf_conntrack_max：连接跟踪条目上限；条目按原方向+回程方向各记一次，
        默认上限（=nf_conntrack_buckets）下满表时平均哈希链长 2。
      - nf_conntrack_count（只读）：当前已分配连接跟踪条目数——接近 max 时
        新连接可能被丢弃。
      - INVALID 状态：nf_conntrack_checksum 校验不符的包进入 INVALID 状态；
        nf_conntrack_tcp_loose 关闭时不再追踪已建立连接。
      排查：防火墙放行但连接不通时查看 conntrack 表占用与 INVALID 统计。
      适用场景：防火墙规则已放行但端口仍 telnet 不通、连接丢包或间歇性失败。
    source_type: official_doc
    source_ref: "https://docs.kernel.org/networking/nf_conntrack-sysctl.html"
    category: network
    tags: [防火墙, conntrack, 连接跟踪]
    confidence: 0.95

  # ============ security ============
  - id: rag-kb-sec-001
    title: "CVE-2023-34362：MOVEit Transfer SQL 注入"
    summary: "NVD 记录的未认证 SQL 注入漏洞（2023 年野外利用）"
    body: |
      依据 NVD 记录（CVE-2023-34362）：
      - 漏洞类型：MOVEit Transfer Web 应用 SQL 注入，未认证攻击者可访问数据库。
      - 影响：根据数据库引擎（MySQL/Microsoft SQL Server/Azure SQL）可推断库结构与
        内容，并可执行修改/删除数据的 SQL。
      - 受影响的版本线：2021.0.6、2021.1.4、2022.0.4、2022.1.5、2023.0.1
        之前的版本（含 2020.0 及更早版本）。
      - 利用状态：2023 年 5-6 月在野外被利用，未打补丁系统可通过 HTTP/HTTPS 被利用。
      处置：升级到修复版本；排查数据库异常访问与入口异常请求。
    source_type: known_issue
    source_ref: "https://nvd.nist.gov/vuln/detail/CVE-2023-34362"
    category: security
    tags: [cve, sql注入, moveit, 漏洞]
    confidence: 1.0
  - id: rag-kb-sec-002
    title: "认证失败与账户保护（OWASP 认证备忘单要点）"
    summary: "OWASP 官方认证安全实践：登录失败提示、密码策略、暴力破解与账户保护"
    body: |
      依据 OWASP Authentication Cheat Sheet 要点：
      - 认证失败处理：统一失败提示（不区分用户不存在/密码错误），防止用户名枚举。
      - 密码策略：允许强密码、限制尝试次数、多因素认证优先。
      - 会话与凭据：会话超时、凭据传输加密、服务端强制校验。
      暴力破解应对：账户锁定/速率限制、来源 IP 限制、禁用默认凭据。
      适用场景：服务器日志出现大量 SSH 登录失败、登录提示不一致可能被枚举账户。
    source_type: official_doc
    source_ref: "https://cheatsheetseries.owasp.org/cheatsheets/Authentication_Cheat_Sheet.html"
    category: security
    tags: [安全, 认证, owasp, 暴力破解]
    confidence: 0.95
  - id: rag-kb-sec-003
    title: "SSL 证书生命周期管理"
    summary: "证书过期导致服务不可用的处置与自动化续期"
    body: |
      证书过期会导致 HTTPS 服务报 NET::ERR_CERT_DATE_INVALID 等错误。
      处置步骤：
      1) 重新申请/续期证书（Let's Encrypt 等 CA），确认私钥与证书匹配。
      2) 部署到服务端并重载（如 nginx -s reload / systemctl reload）。
      3) 验证证书链完整性（完整链而非仅叶子证书）与生效时间。
      4) 配置自动化续期（如 certbot renew）并监控到期时间，避免再次过期。
    source_type: best_practice
    source_ref: "https://certbot.eff.org/change-cert-domain"
    category: security
    tags: [ssl, 证书, https, 续期]
    confidence: 0.95

  # ============ frontend ============
  - id: rag-kb-fe-001
    title: "浏览器加载页面的关键阶段"
    summary: "MDN 官方说明：导航/DNS/TCP/TLS 与主线程对性能的影响"
    body: |
      依据 MDN（How browsers work）性能要点：
      - DNS lookup：每个唯一 hostname 在首次访问时发生一次（之后缓存）；
        页面引用多域名资源（字体/图片/脚本/统计）会多次 DNS 查询，
        移动网络下延迟更明显。
      - TCP 三次握手（SYN-SYN-ACK）：每次连接建立需额外往返。
      - TLS 协商：HTTPS 额外握手确定加密套件并验证服务器。
      - 主线程：浏览器主要单线程，任务串行执行——渲染与交互流畅性
        取决于最小化主线程职责（长任务拆分、避免阻塞）。
      性能目标：降低导航耗时、减少每阶段往返、保持主线程空闲可响应。
      适用场景：网页打不开/加载慢、F12 网络面板显示等待连接（连接建立/TTFB）
      时间特别长时，按上述阶段逐段定位耗时瓶颈。
    source_type: official_doc
    source_ref: "https://developer.mozilla.org/en-US/docs/Web/Performance/How_browsers_work"
    category: frontend
    tags: [性能, 浏览器, dns, tls]
    confidence: 1.0
  - id: rag-kb-fe-002
    title: "首屏加载优化：减少网络阶段开销"
    summary: "从 MDN 加载阶段提炼的资源优化实践"
    body: |
      依据 MDN 加载阶段说明提炼：
      1) 减少跨域资源域名数量（DNS 查询次数随之减少）。
      2) 利用 DNS 缓存与预解析（dns-prefetch / preconnect）缩短首字节前耗时。
      3) HTTPS 场景启用 TLS 会话复用，降低握手开销。
      4) 度量各阶段耗时（导航/DNS/TCP/TLS/渲染），定位瓶颈阶段再针对性优化。
    source_type: best_practice
    source_ref: "https://developer.mozilla.org/en-US/docs/Web/Performance/How_browsers_work"
    category: frontend
    tags: [性能, 优化, dns-prefetch]
    confidence: 0.95

  # ============ account_permission ============
  - id: rag-kb-ac-001
    title: "OWASP 授权（Authorization）要点"
    summary: "官方备忘单：最小权限、水平/垂直提权、服务端强制校验"
    body: |
      依据 OWASP Authorization Cheat Sheet：
      - 授权≠认证：已认证用户未必被授权访问所有资源；
        unauthenticated 用户可被授权访问公开资源。
      - Broken Access Control 是 OWASP 2021 Top 10 最受关注的 Web 漏洞。
      - 最小权限原则（Least Privileges）：水平+垂直双向应用。
      - 水平提权（访问他人资源）是已认证用户常见的越权形态。
      - 授权逻辑缺陷可导致读/写/删受保护资源（保密性/完整性/可用性受损）；
        访问控制日志缺失会使越权难以被发现与归因。
      实践：服务端每个请求强制执行授权校验，不依赖前端隐藏入口。
      适用场景：用户通过修改 URL 参数/资源 ID 看到他人数据（水平提权）、
      普通用户访问管理接口（垂直越权）。
    source_type: official_doc
    source_ref: "https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Cheat_Sheet.html"
    category: account_permission
    tags: [权限, 授权, owasp, 越权]
    confidence: 1.0
  - id: rag-kb-ac-002
    title: "对象级授权与越权排查"
    summary: "水平提权场景的检查清单"
    body: |
      水平提权（访问他人数据）排查：
      1) 确认资源访问是否校验当前用户对目标对象的授权（属主/共享关系）。
      2) 确认授权校验在服务端执行（前端隐藏入口不等于防护）。
      3) 检查默认行为：未授权时是否拒绝（默认拒绝优于默认放行）。
      4) 补充对象级权限测试用例（修改资源 ID 访问他人数据）。
      依据：OWASP 授权备忘单（水平提权是常见越权形态，需服务端强制校验）。
    source_type: best_practice
    source_ref: "https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Cheat_Sheet.html"
    category: account_permission
    tags: [权限, 越权, 水平提权]
    confidence: 0.95

  # ============ os ============
  - id: rag-kb-os-001
    title: "Linux 内存管理核心概念"
    summary: "内核文档：虚拟内存/页缓存/回收/OOM killer"
    body: |
      依据 Linux Kernel 官方文档（Memory Management Concepts）：
      - 虚拟内存抽象物理内存，支持按需分页（demand paging）与进程间受控共享。
      - 物理内存按页帧划分；页表实现虚拟地址→物理地址翻译。
      - 页缓存（Page cache）与匿名内存（Anonymous Memory）是两类主要占用；
        页缓存在内存压力下可被回收（Reclaim）。
      - OOM killer：内存耗尽时内核选择终止进程释放内存。
      排查含义：free 显示的 cache 占用可在压力下回收，不直接代表业务泄漏；
      OOM 终止需定位持续增长的内存占用进程。
    source_type: official_doc
    source_ref: "https://docs.kernel.org/admin-guide/mm/concepts.html"
    category: os
    tags: [内存, 内核, oom, 页缓存]
    confidence: 1.0
  - id: rag-kb-os-002
    title: "内存与磁盘压力排查实践"
    summary: "基于内核概念的操作实践"
    body: |
      1) 磁盘空间满：du 逐层定位大文件与日志增长源，配置日志轮转；
         同时检查 inode 占用。
      2) 内存不足：区分页缓存（可回收）与匿名内存；定位持续增长的进程
         （内存泄漏特征），必要时结合内核 OOM 日志确认被终止进程。
      3) CPU 高：top/pidstat 定位进程，perf 采样栈定位热点；
         区分用户态计算与内核态开销。
      依据：Linux Kernel 内存管理文档 + 系统工具手册。
    source_type: best_practice
    source_ref: "https://docs.kernel.org/admin-guide/mm/concepts.html"
    category: os
    tags: [内存, 磁盘, cpu, 排查]
    confidence: 0.95

  # ============ middleware ============
  - id: rag-kb-mw-001
    title: "Nginx 生产 5xx 调试：Debug Server 方案"
    summary: "官方博客：error_page 重试到专用调试上游聚焦错误日志；网关 502/504 频发、上游间歇性故障时定位"
    body: |
      依据 Nginx 官方博客（Capturing 5xx Errors with a Debug Server）：
      - 背景：生产 5xx 调试难在日志量大（大海捞针）。
      - 方案：配置专用 Debug Server——error_page 检测上游 5xx 后将
        失败请求重试到另一上游组（Debug Server），其日志只含错误事件。
      - Debug Server 可开启完整诊断：应用 debug 模式（完整堆栈）、
        应用服务器调试日志、性能剖析（定位进程间超时）、资源用量日志。
      - 保护：用 server 指令 max_conns 限制转发到 Debug Server 的并发连接，
        防止错误尖峰压垮它。
      - 判别：若某 5xx 在 Debug Server 不重现，可能是上游资源耗尽（扩展瓶颈）
        而非软件 bug。
    source_type: official_doc
    source_ref: "https://blog.nginx.org/blog/capturing-5xx-errors-debug-server"
    category: middleware
    tags: [nginx, 5xx, 调试, error_page]
    confidence: 1.0
  - id: rag-kb-mw-002
    title: "Nginx error_page 与代理错误拦截"
    summary: "error_page 指令作用域与 proxy_intercept_errors 说明"
    body: |
      error_page（ngx_http_core_module）处理 Nginx 自身产生的错误码，
      可配置 http/server/location 作用域；代理（proxy）上游产生的 5xx
      需 proxy_intercept_errors on（ngx_http_proxy_module）才会被 error_page 拦截。
      排查 error_page 不生效：
      1) 指令作用域（http/server/location）是否覆盖当前请求。
      2) 错误页文件路径与权限是否可访问。
      3) 上游错误是否被 proxy_intercept_errors 拦截。
      source: nginx 官方模块文档（ngx_http_core_module / ngx_http_proxy_module）。
    source_type: official_doc
    source_ref: "https://nginx.org/en/docs/http/ngx_http_core_module.html"
    category: middleware
    tags: [nginx, error_page, 代理]
