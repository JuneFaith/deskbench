  # ============ backup ============
  - id: rag-kb-bk-001
    title: "PostgreSQL 逻辑备份：pg_dump 用法与恢复"
    summary: "官方文档：SQL Dump 备份方式要点"
    body: |
      依据 PostgreSQL 官方文档（25.1 SQL Dump）：
      - pg_dump dbname > dumpfile：生成 SQL 命令文件，恢复时重建库到转储时状态。
      - pg_dump 是普通客户端程序：从任意可达主机执行；但无特殊权限，
        需对备份的表有读权限——整库备份几乎必须用超级用户运行；
        也可按 schema/表部分备份（-n schema / -t table）。
      - 连接参数：-h host / -p port，默认取 PGHOST/PGPORT；
        用户名默认等于 OS 用户（-U 覆盖）；连接受正常客户端认证约束。
      - 优势：可跨版本恢复（文件级备份与归档则版本相关）；
        转储内部一致（快照语义），不阻塞其他操作（排除 ALTER TABLE 等排他锁）。
      - 恢复：文本转储用 psql -X dbname < dumpfile（库需先建，createdb -T template0）；
        非文本格式用 pg_restore；恢复前对象属主用户必须已存在。
    source_type: official_doc
    source_ref: "https://www.postgresql.org/docs/17/backup-dump.html"
    category: backup
    tags: [备份, postgres, pg_dump, 恢复]
    confidence: 1.0
  - id: rag-kb-bk-002
    title: "配置变更故障复盘流程（公开 postmortem 提炼）"
    summary: "internal_sop：数据库权限变更引发间歇性报错的故障处置流程（Cloudflare 2025-11-18 复盘提炼）"
    body: |
      依据 Cloudflare 公开复盘（2025-11-18 outage）：
      故障链：一次数据库权限变更 → 生成的配置产物（feature file）异常翻倍
      → 产物全网传播 → 读取该产物的软件超限失败 → 核心流量路由失败。
      关键教训与处置流程：
      1) 变更影响：权限/配置类变更需评估对下游产物的影响（本例权限变更
         改变了查询输出规模）。
      2) 快速识别：异常呈间歇性恢复/失败（好/坏产物交替生成与传播）时
         优先怀疑配置产物而非攻击。
      3) 止损：停止异常产物的生成与传播；将已知良好版本手动插入分发队列；
         强制重启受影响组件；随后逐组件恢复并观察长尾。
      复盘改进：为生成类产物的规模设上限/校验，防止软件超限。
    source_type: internal_sop
    source_ref: "https://blog.cloudflare.com/18-november-2025-outage/"
    category: backup
    tags: [变更, 复盘, 故障, sop]
    confidence: 0.95

  # ============ 优化补齐（全部基于已抓来源） ============
  - id: rag-kb-db-004
    title: "数据库连接失败排障顺序"
    summary: "从官方文档提炼的连接失败分步判定"
    body: |
      综合官方文档（PostgreSQL 认证/启动 + 云厂商连接排查）的排障顺序：
      1) 能否连通：Connection timed out / 网络层失败 → 网络互通、白名单、
         监听地址与端口（客户端认证会先通过 pg_hba 检查）。
      2) 认证拒绝：no pg_hba.conf entry → 配置与 reload；
         password authentication failed → 密码与认证方法。
      3) 资源拒绝：remaining connection slots → 连接数满；
         实例锁定（rds-deny-access）→ 续费/扩容。
      4) 判读：服务端日志常比客户端报错含更多细节。
    source_type: best_practice
    source_ref: "https://www.postgresql.org/docs/17/client-authentication-problems.html"
    category: database
    tags: [postgres, 连接, 排障]
    confidence: 0.95
  - id: rag-kb-net-004
    title: "VPN 连接故障快速判定矩阵"
    summary: "按初始化结果与 ping 结果二维定位（OpenVPN 官方文档）"
    body: |
      依据 OpenVPN 官方文档（Starting Up the VPN and Testing）整理：
      - 初始化未完成（无 Initialization Sequence Completed）：
        连通性问题——hostname/IP/端口错误、NAT 端口转发缺失、
        服务器防火墙未放行（默认 UDP 1194）。
      - 初始化完成但有错误（Windows）：DHCP client 服务未运行/
        第三方个人防火墙不兼容。
      - 初始化完成但 ping 失败：TUN/TAP 接口被防火墙过滤（两侧检查）。
      - 服务器有 TLS: Initial packet 但客户端无对应行：
        单向连接，回程方向被阻断。
      验证基线：路由模式 ping 10.8.0.1；桥接模式 ping 服务器子网主机。
    source_type: best_practice
    source_ref: "https://openvpn.net/community-docs/starting-up-the-vpn-and-testing-for-initial-connectivity.html"
    category: network
    tags: [vpn, openvpn, 判定, 排障]
    confidence: 1.0
  - id: rag-kb-sec-004
    title: "认证加固：防枚举与暴力破解（OWASP）"
    summary: "防暴力破解与账户加固：SSH 登录失败、账户锁定、速率限制、多因素认证"
    body: |
      依据 OWASP Authentication Cheat Sheet 要点：
      - 统一认证失败提示：不区分"用户不存在"与"密码错误"，防用户名枚举。
      - 失败处理：限制尝试次数、账户锁定/速率限制，缓解暴力破解。
      - 凭据安全：强密码策略、多因素认证优先、传输加密。
      处置场景：服务器被暴力破解 → 禁用弱口令、密钥认证、来源 IP 限制。
      适用场景：SSH 登录记录大量失败、有人持续尝试登录服务器（撞库/暴力破解）。
    source_type: best_practice
    source_ref: "https://cheatsheetseries.owasp.org/cheatsheets/Authentication_Cheat_Sheet.html"
    category: security
    tags: [安全, 认证, 加固, 枚举]
    confidence: 0.95
  - id: rag-kb-bk-003
    title: "PostgreSQL 转储恢复执行清单"
    summary: "从官方文档提炼的恢复步骤与前置条件"
    body: |
      依据 PostgreSQL 官方文档（25.1 SQL Dump）恢复要点：
      1) 文本转储：psql -X dbname < dumpfile（-X 保证默认设置）。
      2) 目标库需先创建：createdb -T template0 dbname（psql 不会建库）。
      3) 前置条件：所有对象属主/被授权用户必须已存在，否则对象重建失败。
      4) 非文本格式（自定义/目录格式）用 pg_restore 恢复。
      5) 默认 psql 脚本遇 SQL 错误继续执行——注意错误输出。
    source_type: best_practice
    source_ref: "https://www.postgresql.org/docs/17/backup-dump.html"
    category: backup
    tags: [备份, postgres, 恢复, pg_restore]
    confidence: 1.0

  # ============ 第三批补充（2026-08-10）：补薄弱 source_type ============
  - id: rag-kb-db-005
    title: "PostgreSQL 客户端连接问题：错误含义对照"
    summary: "官方文档 18.3.2：Connection refused / No such file or directory / Connection timed out 含义与定位"
    body: |
      依据官方文档（18.3.2 Client Connection Problems）：
      - psql: ... failed: Connection refused. Is the server running on that host
        and accepting TCP/IP connections?
        → 通用"找不到服务器对话"失败，通常表示该地址/端口上没有服务器在
        监听；常见原因是服务器未配置允许 TCP/IP 连接（listen_addresses）。
        注意：Connection refused 不表示服务器拒绝了连接请求（被拒绝会返回
        另一类消息，见 20.15 Authentication Problems）。
      - psql: connection to server on socket "..." failed: No such file or directory
        → Unix socket 场景：核对客户端 socket 路径与服务器
        unix_socket_directories 设置是否一致。
      - Connection timed out → 更基础的问题：网络连通性缺失或防火墙阻断。
      提示：连接失败消息总是显示服务器地址或 socket 路径，先核对客户端
      连的是不是对的地方。
    source_type: official_doc
    source_ref: "https://www.postgresql.org/docs/17/server-start.html"
    category: database
    tags: [postgres, 连接, refused, socket]
    confidence: 1.0
  - id: rag-kb-net-005
    title: "阿里云 ECS 安全组规则未生效排查"
    summary: "厂商知识库：安全组放行后端口仍不通的分层排查"
    body: |
      依据阿里云官方文档（ECS 实例的安全组规则未生效问题排查）：
      1) 实例是否加入目标安全组：未关联已配置规则的安全组则规则不生效，
         到实例详情页核对绑定关系。
      2) 服务状态与端口监听：安全组放行不代表服务可用——服务未启动或端口
         未监听时连接请求无法得到响应。
      3) 监听地址：0.0.0.0 接受所有 IPv4 网卡连接；设为特定 IP 时仅该 IP
         可访问（多网卡场景常见）。
      4) 安全组规则配置：协议/端口/源 IP 段与期望匹配；关联多个安全组时
         确认规则优先级，避免高优先级拒绝规则冲突。
      5) 实例内系统防火墙：确保未阻止对应端口、与安全组规则不冲突。
    source_type: vendor_kb
    source_ref: "https://help.aliyun.com/zh/ecs/user-guide/the-security-group-rules-for-the-ecs-instance-are-not-applied"
    category: network
    tags: [安全组, 阿里云, 端口, 防火墙]
    confidence: 0.95
  - id: rag-kb-mw-003
    title: "CVE-2023-44487：HTTP/2 Rapid Reset 拒绝服务"
    summary: "NVD 记录：HTTP/2 快速重置流消耗服务器资源（2023 年 8-10 月野外利用）"
    body: |
      依据 NVD 记录（CVE-2023-44487，HTTP/2 Rapid Reset）：
      - 漏洞性质：HTTP/2 协议层拒绝服务——攻击者通过快速取消（RST_STREAM）
        大量并发流，使服务器持续处理重置请求而消耗资源，可发起规模空前的
        DDoS 攻击。
      - 利用状态：2023 年 8-10 月在野外被利用，多家大型云厂商/CDN 受影响。
      - 影响面：实现 HTTP/2 的服务器与反向代理（含 nginx）均在影响范围。
      - 处置：升级到修复版本；按厂商公告施加缓解措施（如限制单连接并发流数、
        收紧 RST_STREAM 处理速率）；监控异常流量与资源水位。
      - 相关：nginx 官方公告（HTTP/2 Rapid Reset attack impacting F5/nginx
        products，见 NVD references）。
    source_type: known_issue
    source_ref: "https://nvd.nist.gov/vuln/detail/CVE-2023-44487"
    category: middleware
    tags: [cve, http2, ddos, nginx]
    confidence: 1.0
  - id: rag-kb-bk-004
    title: "批量删除事故复盘流程（Atlassian 2022 PIR 提炼）"
    summary: "internal_sop：大规模数据删除事故的处置与预防要点"
    body: |
      依据 Atlassian 公开 PIR（2022-04 事故）：
      故障链：删除遗留应用的任务脚本被传入了整个站点 ID（而非应用 ID），且
      删除 API 同时接受站点/应用两类标识、无类型确认告警 → 23 分钟内删除
      883 个站点（775 客户），部分站点恢复长达 14 天。
      关键教训与处置流程：
      1) 高危操作前置防护：删除类任务应对输入做类型/范围校验（软删除、
         二次确认、类型不匹配告警），避免"传错 ID 直接全删"。
      2) 沟通边界：任务请求方与执行方的信息传递（此处为 ID 语义）需显式化，
         不得靠默认假设。
      3) 恢复准备：多站点、多产品的自动化恢复能力（DR 演练常态化）直接
         决定 RTO；客户联系信息等关键元数据需独立备份。
      4) 复盘产出：软删除通用化、删除流程分级审批、大规模事故演练与公开
         沟通预案。
    source_type: internal_sop
    source_ref: "https://www.atlassian.com/engineering/post-incident-review-april-2022-outage"
    category: backup
    tags: [删除, 复盘, sop, 数据安全]
    confidence: 0.95

  # ============ 第四批补充（2026-08-10）：补齐工单主题对应 KB 缺口 ============
  - id: rag-kb-sec-005
    title: "会话管理与会话固定防御（OWASP）"
    summary: "会话 ID 交换机制限制、登录后轮换、Cookie 安全属性"
    body: |
      依据 OWASP Session Management Cheat Sheet：
      - 会话固定防御：仅接受 cookie 作为会话 ID 交换机制，不接受 URL 参数等
        其它机制传入的会话 ID；登录成功后轮换/重新生成会话 ID。
      - Cookie 安全属性：Secure / HttpOnly / SameSite，并限制 Domain/Path 范围。
      - 传输安全：整个会话全程 HTTPS，避免会话 ID 明文暴露。
      场景：安全测试发现登录前后 session ID 不变——按上述条目核对与修复。
    source_type: official_doc
    source_ref: "https://cheatsheetseries.owasp.org/cheatsheets/Session_Management_Cheat_Sheet.html"
    category: security
    tags: [会话, session, cookie, 固定]
    confidence: 1.0
  - id: rag-kb-os-003
    title: "cron 定时任务未执行排查（crontab(5)）"
    summary: "环境变量、时区、文件权限与损坏判定"
    body: |
      依据 crontab(5) 手册：
      - 环境：cron 自动设置 SHELL=/bin/sh、LOGNAME 与 HOME 取自 /etc/passwd；
        非交互环境 PATH 有限，脚本依赖的 PATH 与环境变量需在 crontab 内显式设置。
      - 时区：CRON_TZ 可指定时区；夏令时缺失时段任务不会执行、重复时段会执行两次。
      - 文件：crontab 文件必须仅属主可写（CAVEATS），末行需以换行结束否则视为损坏；
        系统 crontab（/etc/cron.d）每行需带用户名；cron 每分钟检查一次条目。
      场景：定时任务到点未执行但手动正常——按上述条目排查环境变量与时区。
    source_type: official_doc
    source_ref: "https://man7.org/linux/man-pages/man5/crontab.5.html"
    category: os
    tags: [cron, 定时任务, 环境变量, 时区]
    confidence: 1.0
  - id: rag-kb-ac-003
    title: "OAuth 2.0 scope 授权范围（RFC 6749 §3.3）"
    summary: "scope 语义、服务器裁剪与回告"
    body: |
      依据 OAuth 2.0 规范（RFC 6749 §3.3）：
      - scope 为空格分隔的权限字符串，每个 scope 增加一段访问范围。
      - 授权服务器可基于策略或资源所有者指示完全/部分忽略客户端请求的 scope；
        签发范围不同时须用 scope 响应参数告知客户端。
      - 客户端省略 scope 时服务器须用预定义默认值处理或拒绝。
      实践：scope 最小化授予，服务器侧按策略裁剪并回告实际授予范围。
    source_type: official_doc
    source_ref: "https://datatracker.ietf.org/doc/html/rfc6749#section-3.3"
    category: account_permission
    tags: [oauth, scope, 授权, 最小权限]
    confidence: 1.0
  - id: rag-kb-mw-004
    title: "Nginx client_max_body_size 与 413"
    summary: "请求体大小限制默认值、作用域与调优"
    body: |
      依据 nginx 官方模块文档（ngx_http_core_module）：
      - client_max_body_size 设置客户端请求体最大允许大小，默认 1m，
        超限返回 413（Request Entity Too Large）。
      - 指令可用于 http/server/location 作用域，按业务上传上限在对应作用域调大。
      - 注意浏览器无法正确显示该错误；设为 0 关闭检查。
      场景：上传大文件报 413 而小文件正常——调整 client_max_body_size。
    source_type: official_doc
    source_ref: "https://nginx.org/en/docs/http/ngx_http_core_module.html"
    category: middleware
    tags: [nginx, "413", 上传, client_max_body_size]
    confidence: 1.0
  - id: rag-kb-mw-005
    title: "Nginx WebSocket 反向代理配置"
    summary: "Upgrade/Connection 逐跳头传递与连接保活"
    body: |
      依据 nginx 官方文档（WebSocket proxying）：
      - Upgrade/Connection 是逐跳（hop-by-hop）头，反向代理默认不转发，
        需显式传递 proxy_set_header Upgrade $http_upgrade 与
        proxy_set_header Connection "upgrade"（或用 map 依据 $http_upgrade
        动态设置 Connection）。
      - 默认 60 秒无数据即关闭连接，可调大 proxy_read_timeout 或让后端
        周期性发送 WebSocket ping 帧保活。
      场景：WebSocket 经 nginx 反代后连接失败或频繁断开——核对升级头传递与超时。
    source_type: official_doc
    source_ref: "https://nginx.org/en/docs/http/websocket.html"
    category: middleware
    tags: [nginx, websocket, upgrade, 代理, 保活]
    confidence: 1.0
  - id: rag-kb-fe-003
    title: "渲染阻塞与关键渲染路径（MDN）"
    summary: "script 阻塞解析、CSS 不阻塞解析、白屏优化"
    body: |
      依据 MDN 浏览器工作原理：
      - HTML 解析遇到无 async/defer 的 <script> 会阻塞渲染；CSS 文件不阻塞解析。
      - DOM 节点越多 DOM 树构建越久；首屏渲染前 HTML/CSS/JavaScript 均需
        解析完成（关键渲染路径）。
      - 优化：非关键脚本加 async/defer 或拆分加载，控制首屏 DOM 规模。
      场景：首屏长时间白屏、渲染等待脚本执行——按关键渲染路径优化。
    source_type: official_doc
    source_ref: "https://developer.mozilla.org/en-US/docs/Web/Performance/How_browsers_work"
    category: frontend
    tags: [渲染, 阻塞, 白屏, 关键渲染路径]
    confidence: 1.0

  # ============ 第五批补充（2026-08-10）：弱主题 KB 补齐 ============
  - id: rag-kb-ac-004
    title: "多因素认证（MFA）实施要点（OWASP）"
    summary: "MFA 因子类型、实施建议与 OTP 处理规范"
    body: |
      依据 OWASP Multifactor Authentication Cheat Sheet：
      1) 因子类型：知识（密码/PIN/安全问题）、持有（OTP/U2F/证书/短信/邮件）、
         固有（生物特征）、位置（IP/地理围栏）、行为（击键/鼠标动态）；
         要求多个同类因子（如密码+PIN）不构成 MFA，因子应相互独立。
      2) 口令类攻击（暴力破解/撞库/口令喷洒）是账号失陷主因，MFA 是最佳防线
         （微软分析：可阻止 99.9% 账号入侵）；系统应按密码终将泄露为前提设计。
      3) 实施建议：要求所有用户启用某种 MFA（首选 TOTP）；管理员等高权限用户
         强制 MFA；提供安全的 MFA 重置流程；敏感操作（改密/改邮箱/关闭 MFA/
         会话提权）也要求 MFA；多认证入口（独立 API/移动端）同样要求 MFA。
      4) OTP 处理：短 TTL、一次性、严格尝试限制、验证后作废；不写日志、
         不长期明文存储；用密码学安全随机数生成；代码 8 位及以上；
         重发时生成新 OTP 并覆盖旧记录。
      适用场景：员工账号被撞库后强制全员 MFA、账号安全加固、高权限账号保护。
    source_type: official_doc
    source_ref: "https://cheatsheetseries.owasp.org/cheatsheets/Multifactor_Authentication_Cheat_Sheet.html"
    category: account_permission
    tags: [权限, mfa, 2fa, 认证, otp]
    confidence: 1.0
  - id: rag-kb-ac-005
    title: "API1:2023 对象级授权缺失（BOLA，OWASP API Security）"
    summary: "操纵对象 ID 越权访问他人数据的 API 漏洞判定与预防"
    body: |
      依据 OWASP API Security Top 10（API1:2023 Broken Object Level Authorization）：
      - 攻击形态：操纵请求中的对象 ID（路径/查询/头部/负载中的顺序整数、UUID
        或字符串）访问他人对象；API 场景极常见——服务端常不跟踪客户端状态，
        依赖客户端传入的对象 ID 决定访问目标。
      - 判定：每个接收对象 ID 并执行操作的端点都应做对象级授权校验（当前用户
        对目标对象执行该操作是否有权限）；仅比对会话用户 ID（如 JWT）与参数 ID
        不足以解决 BOLA。
      - BOLA vs BFLA：用户本就有端点访问权、在对象级越权是 BOLA；访问本无权限
        的端点/功能是 BFLA。
      - 预防：基于用户策略与层级实现授权；每个用客户端输入访问数据库记录的函数
        都检查授权；对象 ID 优先用随机不可预测的 GUID；为授权机制写测试，
        不部署使测试失败的改动。
      适用场景：API 遍历 ID 拉取他人数据、订单/文档 ID 越权访问（IDOR）。
    source_type: official_doc
    source_ref: "https://owasp.org/API-Security/editions/2023/en/0xa1-broken-object-level-authorization/"
    category: account_permission
    tags: [权限, bola, idor, api, 越权]
    confidence: 1.0
  - id: rag-kb-os-004
    title: "文件描述符限制与 too many open files（limits.conf）"
    summary: "nofile 软硬限制、配置语法与排查入口"
    body: |
      依据 limits.conf(5)（Linux-PAM pam_limits 模块）：
      - 配置文件：/etc/security/limits.conf 与 /etc/security/limits.d/*.conf；
        语法 <domain> <type> <item> <value>；domain 可为用户名/@组名/*通配/uid 范围。
      - type：hard（root 设定、内核强制、用户不可超过）、soft（用户可在 hard
        范围内自行调整）、-（同时施加）。
      - item：nofile 限制最大打开文件描述符数；nproc 限制最大进程数；
        限制按登录会话施加（非全局）。
      - 排查 too many open files：确认运行用户/组的 nofile 软硬限制
        （ulimit -n / prlimit）；用 lsof/ss 检查进程打开的 fd 与连接，
        定位句柄泄漏（未关闭连接/文件）；按业务调整 limits.conf 或进程启动
        ulimit；系统级上限见 /proc/sys/fs/file-max（setrlimit(3)）。
      适用场景：服务运行一段时间后报 too many open files、连接数增长后必现。
    source_type: official_doc
    source_ref: "https://man7.org/linux/man-pages/man5/limits.conf.5.html"
    category: os
    tags: [os, 文件描述符, ulimit, nofile, limits]
    confidence: 1.0
  - id: rag-kb-fe-004
    title: "前端发布后用户仍看到旧页面（HTTP 缓存未更新）"
    summary: "新版本上线后用户仍加载旧资源/旧页面——缓存两态与更新策略（hash 文件名 + no-cache 重新验证）"
    body: |
      依据 MDN HTTP Caching：
      - 缓存类型：私有缓存（浏览器，可存个性化响应，需 Cache-Control: private）
        与共享缓存（代理/CDN/反向代理/Service Worker）。
      - fresh/stale：存储的响应分新鲜（可重用）与过期（需重新验证）两态，
        判定标准通常由 Cache-Control 决定。
      - 启发式缓存：无 Cache-Control 时响应仍可能被存储重用（如 Last-Modified
        距今一年，重用约存储时间的 10%）——应显式指定 Cache-Control。
      - 更新策略：静态资源用内容指纹（hash 文件名）+ 长 max-age；HTML 用
        no-cache 每次重新验证；发布时 HTML 引用新指纹资源即可完成更新。
      适用场景：发布新版本后用户仍看到旧页面、资源缓存未更新、刷新多次才生效。
    source_type: official_doc
    source_ref: "https://developer.mozilla.org/en-US/docs/Web/HTTP/Caching"
    category: frontend
    tags: [前端, 缓存, http, cache-control, max-age, 旧页面, 发布]
    confidence: 1.0

