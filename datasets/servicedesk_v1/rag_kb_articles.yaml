  - id: rag-kb-fe-005
    title: "CORS 跨域错误定位（MDN）"
    summary: "浏览器 CORS 错误识别、预检请求与常见 Reason 对照"
    body: |
      依据 MDN（CORS errors）文档：
      1) 识别：CORS 违规时浏览器控制台显示 Cross-Origin Request Blocked:
         The Same Origin Policy disallows reading the remote resource at
         https://some-url-here. (Reason: ...)。出于安全原因，具体失败细节对
         JavaScript 不可见（代码只知道发生了错误），唯一途径是查看浏览器
         控制台获取细节。
      2) 服务端主导：多数 CORS 错误只能在服务端解决，因为服务端控制是否
         允许跨域访问。
      3) 客户端可做：
         - 避免触发预检（preflight）：仅用 GET/HEAD/POST、仅设置
           CORS-safelisted 请求头（Accept/Content-Language/Content-Type）、
           Content-Type 仅 application/x-www-form-urlencoded /
           multipart/form-data / text/plain——简单请求完全跳过预检。
         - no-cors 模式：不读响应体/头时（埋点 beacon、service worker
           加载资源）fetch(..., {mode: "no-cors"})，响应为 opaque（status
           0、头为空、body 不可读）——放弃读取以绕过检查。
         - 自控代理：不控制远端且远端不设 CORS 头时，经自己控制的服务器
           转发并附加 CORS 头（增加延迟与依赖）。
      4) 常见 Reason（Firefox 控制台）：Access-Control-Allow-Origin missing /
         does not match、Credentials 与 * 冲突（Credential is not supported
         if ... is '*'）、Allow-Methods/Allow-Headers 缺方法/缺 token、
         Multiple Access-Control-Allow-Origin not allowed、preflight channel
         did not succeed。
      适用场景：前端调另一域名接口报 CORS 错误、浏览器拦截跨域请求。
    source_type: official_doc
    source_ref: "https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/CORS/Errors"
    category: frontend
    tags: [前端, cors, 跨域, 浏览器, 预检]
    confidence: 1.0
  - id: rag-kb-ac-006
    title: "忘记密码/密码重置安全（OWASP）"
    summary: "防用户枚举、重置令牌安全与重置流程要点"
    body: |
      依据 OWASP Forgot Password Cheat Sheet：
      - 防用户枚举：对存在与不存在账号返回一致消息；响应时间一致
        （异步调用或统一逻辑，避免快速退出分支造成时间侧信道）；防自动化
        刷请求——按账号限流、CAPTCHA 等。
      - 令牌/验证码要求：密码学安全随机算法生成；足够长防暴力破解；
        安全存储；一次性使用并在适当时间后过期；未验证有效令牌前不得
        改变账号状态（如锁定账号——会被用于拒绝已知用户名访问）。
      - 重置流程：用户确认两次新密码；遵守统一密码策略；按安全实践存储
        密码；发送重置完成邮件（绝不发送明文密码）；重置后经常规机制登录
        （不自动登录，避免额外认证/会话复杂度）；询问或自动作废既有会话。
      - URL 令牌：用 HTTPS；创建重置 URL 不依赖 Host 头（防 Host Header
        Injection，URL 硬编码或校验信任域名白名单）；重置页加 Referrer
        Policy noreferrer 防 referrer 泄漏；限流防 URL 令牌暴力尝试。
      - 安全问题是重置密码的可选附加层，不应作为唯一机制（答案常可猜测/
        被获取）。
      适用场景：忘记密码功能可枚举用户、重置令牌被暴力尝试、重置流程不合规。
    source_type: official_doc
    source_ref: "https://cheatsheetseries.owasp.org/cheatsheets/Forgot_Password_Cheat_Sheet.html"
    category: account_permission
    tags: [权限, 认证, 密码重置, 枚举, forgot-password]
    confidence: 1.0
  - id: rag-kb-os-005
    title: "日志轮转配置（logrotate(8)）"
    summary: "轮转/压缩/删除日志的指令与排查入口"
    body: |
      依据 logrotate(8) 手册：
      - 定位：logrotate 用于轮转、压缩、删除、邮件发送系统日志；每个日志
        可按 daily/weekly/monthly 或按大小（size）处理；通常作为每日 cron
        作业（或 systemd 下 logrotate.timer）运行；同一日志一天最多轮转
        一次，除非按 size 触发且当日多次运行，或用 -f/--force 强制。
      - 配置示例：
        /var/log/messages {
            rotate 5
            weekly
            postrotate
                /usr/bin/killall -HUP syslogd
            endscript
        }
      - 常用指令：
        rotate count——轮转 count 次后删除/邮寄（count=0 直接删除旧版，
        count=-1 永不删除（注意 maxage 与性能/磁盘代价））。
        size 100k/100M/100G——按大小轮转，与时间间隔选项互斥。
        olddir dir——旧日志移入指定目录（须与日志同物理设备，除非用
        copy/copytruncate/renamecopy）。
        missingok——日志缺失时静默跳过（默认 nomissingok 报错）。
        compress/nocompress——旧版用 gzip 压缩；delaycompress 推迟到下一轮。
        copytruncate——程序无法被告知关闭日志文件时，复制后原位截断
        （复制与截断间极小窗口可能丢少量日志）。
        dateext——旧版加日期后缀 YYYYMMDD 而非数字。
        su user group——非 root 属主日志用该用户/组轮转（root 下推荐）。
      - 状态与调试：默认状态文件 /var/lib/logrotate.status；-d/--debug
        只输出不修改；-f/--force 强制轮转；-s 指定替代状态文件。
      - 注意：通配符 * 会轮转所有匹配文件（含已轮转的），用 olddir 或更精确
        的 *.log 规避；systemd 下 logrotate.service 默认 ProtectSystem=full
        阻止修改 /etc 与 /usr 下的日志。
      适用场景：日志不轮转越涨越大、磁盘被日志占满、需要配置轮转策略。
    source_type: official_doc
    source_ref: "https://man7.org/linux/man-pages/man8/logrotate.8.html"
    category: os
    tags: [日志, 轮转, logrotate, compress, 磁盘]
    confidence: 1.0
