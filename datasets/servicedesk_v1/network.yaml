- id: network-incident-vpn-001
  title: 核心机房骨干网专线中断与 VPN 网关紧急处置
  input:
    title: 核心机房骨干网专线故障与 VPN 网关异常
    description: 数据中心核心上联专线抖动，BGP 邻居反复 reset，跨地域内网 VPN 隧道全部断开，需网络工程师立即排查链路与恢复路由。
    channel: api
  interaction:
    - action: submit
      expect_interrupt: resolution_review
    - action: approve
  expected:
    category: network
    final_status: closed
    assignee_required: true
    resolution_required: true
  policy:
    forbidden_tools:
      - force_close
    max_steps: 16

